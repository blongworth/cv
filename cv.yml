# CV content. Rendered by cv.typ; build every version with `sh build.sh`.
#
# Versions: each entry under `versions:` is one output. Items appear in the
# versions listed in `in:` (default: [full]). Any text field may be a plain
# string (same everywhere) or a map keyed by version; lookup order is the
# current version, then its `fallback` list, then `full`.
#
# Text fields are Typst markup: _italic_, *bold*. Escape # $ @ < * _ with \.

versions:
  full:
    margin: {x: 1in, y: 0.75in}
    pub-style: apa.csl  # modified APA 7: newest first
    pubs: all
    sections: [interests, skills, experience, education, teaching, service, awards, affiliations, pubs, abstracts]
  onepage:
    margin: {x: 0.5in, y: 0.4in}
    pub-style: nature
    # Curated keys from references.bib. New ORCID works are NOT added here
    # automatically -- add their key to show them on the one-page CV.
    pubs: [longworth2022radiocarbon, longworth2015injector, longworth2013carbonate, longworth2007lithology]
    fallback: [full]
    sections: [interests, skills, experience, education, summary, pubs]

header:
  name: Brett Longworth
  title: Research Associate III, Marine Chemistry and Geochemistry
  address: David Center for Ocean Innovation, MS#61, Woods Hole Oceanographic Institution, Woods Hole, MA 02543
  email: blongworth@whoi.edu
  phone: (508) 289-1559
  orcid: 0000-0001-8318-2054

interests:
  title: Research Interests
  items:
    full:
      - Dissolved gasses as tracers of ecosystem function in seawater.
      - Microcontroller systems for sensors, platforms, and telemetry.
      - Shipboard sensor data acquisition and integration.
      - Data communication using interactive web applications.
      - Improving the efficiency, reliability, and precision of field-deployed quadrupole mass spectrometry.
      - Radiocarbon as a tracer of carbon source in natural systems.
    onepage:
      - Dissolved gasses as tracers of ecosystem function in seawater.
      - Microcontroller systems, sensor platforms, telemetry, and shipboard data integration.
      - Field-deployed quadrupole mass spectrometry; radiocarbon as a tracer of carbon source.

skills:
  title: Skills
  items:
    full:
      - Shipboard and laboratory experience with mass spectrometry, gas handling, and chemical analysis.
      - Development of sensor platforms and telemetry systems for oceanographic research.
      - Proficient in R, Python, SQL, UNIX, Shell, HTML, and LabVIEW.
      - Skilled with C++ and Visual Basic.
      - Some experience with Matlab, Javascript and C.
      - Versioning and collaborative development with git/GitHub.
      - Cloud and local development/deployment of data-driven web applications and data pipelines.
      - R/Python skills include data analysis, report generation, interactive web applications with Shiny.
      - Agentic coding skills including pipeline validation and testing, agentic embedded development.
      - Extensive troubleshooting skills.
      - Microcontroller programming for data acquisition and communication using C++ and MicroPython.
      - Certified coding and data science instructor for The Carpentries.
      - Some design and CAD experience with SOLIDWORKS, Fusion, and KiCAD.
      - Development of small and large mass spectrometer beamline improvements and gas handling systems.
      - Statistics for data reduction/analysis and quality assessment.
      - Qualified WHOI small boat operator.
    onepage:
      - Carpentries-certified instructor, course organization, lesson development
      - R, Python, C++/MicroPython (microcontrollers), Shell, git/GitHub, and data-driven web applications.
      - Data pipelines, statistics for data reduction and QA/QC, cloud and local deployment, agentic coding.
      - Shipboard and laboratory mass spectrometry, chemical analysis, sensor platform and telemetry development.

