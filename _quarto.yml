project:
  title: "Brett Longworth CV"
  render:
    - cv.qmd
    - cv-onepage.qmd
  post-render:
    - python3 scripts/bold_bib_names.py

format:
  typst:
    papersize: us-letter
    margin:
      x: 1in
      y: 0.75in
    fontsize: 10pt
    mainfont: "Helvetica"
    toc: false
    include-in-header: cv-style.typ
    keep-typ: true
  html:
    toc: false
    embed-resources: true
    title-block-banner: false

bibliography: references.bib
# Full CV lists every reference; cv-onepage.qmd overrides this with a
# curated list (must live here, not in cv.qmd front matter, to be overridable).
nocite: |
  @*
csl: apa.csl
citeproc: true
link-citations: false
