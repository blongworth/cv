project:
  title: "Brett Longworth CV"
  render:
    - cv.qmd
  post-render:
    - python3 scripts/bold_bib_names.py

format:
  typst:
    papersize: us-letter
    margin:
      x: 1in
      y: 0.75in
    fontsize: 10pt
    mainfont: "Helvetica"
    toc: false
    include-in-header: cv-style.typ
    keep-typ: true

bibliography: references.bib
csl: apa.csl
citeproc: true
link-citations: false
